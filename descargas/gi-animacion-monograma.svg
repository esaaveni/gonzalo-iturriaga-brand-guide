<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 690 690" role="img" aria-label="Animación del logo" width="690" height="690">
<title>Gonzalo Iturriaga Arquitectos. Monograma que se dibuja, 4,5 s</title>
<style>.str{fill:none;stroke:#fff;stroke-width:52;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.stg{animation:sdraw 0.9s cubic-bezier(.4,0,.2,1) 0.2s forwards}
.sti{animation:sdraw 0.35s cubic-bezier(.4,0,.2,1) 1.1s forwards}
.sta{animation:sdraw 0.75s cubic-bezier(.4,0,.2,1) 1.45s forwards}
.sguia{fill:none;stroke:#C84B31;stroke-width:1.3;opacity:.7}
.smr{animation:sslide 0.9s cubic-bezier(.4,0,.2,1) 2.2s forwards}
.smh{animation:sslide 1.3s cubic-bezier(.45,0,.55,1) 3.2s forwards}
@keyframes sdraw{to{stroke-dashoffset:0}}
@keyframes sslide{to{transform:translateX(1300px)}}

@media (prefers-reduced-motion: reduce){.str{animation:none;stroke-dashoffset:0}.sguia{display:none}}</style>
<defs>
  <mask id="smG" maskUnits="userSpaceOnUse" x="-120" y="-120" width="820" height="820"><path class="str stg" d="M84.9 313.0 A128 128 0 1 0 268.0 412.4 L162 414.5" pathLength="1"/></mask>
  <mask id="smI" maskUnits="userSpaceOnUse" x="-120" y="-120" width="820" height="820"><path class="str sti" d="M154.7 -13.5 L207.2 225.6" pathLength="1"/></mask>
  <mask id="smA" maskUnits="userSpaceOnUse" x="-120" y="-120" width="820" height="820"><path class="str sta" d="M565.7 313.5 L335.5 74 L341 337 L432 296" pathLength="1"/></mask>
</defs>
<g transform="translate(-24 -24) rotate(45)">
  <defs>
    <linearGradient id="sgr"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff"/><stop offset=".62" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="sgh"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#000"/><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="smr" maskUnits="userSpaceOnUse" x="-120" y="-60" width="1110" height="120"><rect class="smr" x="-1508" y="-60" width="2400" height="120" fill="url(#sgr)"/></mask>
    <mask id="smh" maskUnits="userSpaceOnUse" x="-120" y="-60" width="1110" height="120"><rect class="smh" x="-1508" y="-60" width="2400" height="120" fill="url(#sgh)"/></mask>
  </defs>
  <g mask="url(#smh)"><line class="sguia" x1="0" y1="0" x2="868" y2="0" mask="url(#smr)" vector-effect="non-scaling-stroke"/></g>
</g>
