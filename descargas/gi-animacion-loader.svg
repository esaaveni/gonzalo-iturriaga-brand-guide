    <linearGradient id="lbgh"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#000"/><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="lbmr" maskUnits="userSpaceOnUse" x="-120" y="-60" width="1110" height="120"><rect class="lbr" x="-1508" y="-60" width="2400" height="120" fill="url(#lbgr)"/></mask>
    <mask id="lbmh" maskUnits="userSpaceOnUse" x="-120" y="-60" width="1110" height="120"><rect class="lbh" x="-1508" y="-60" width="2400" height="120" fill="url(#lbgh)"/></mask>
  </defs>
  <g mask="url(#lbmh)"><line class="lbguia" x1="0" y1="0" x2="868" y2="0" mask="url(#lbmr)" vector-effect="non-scaling-stroke"/></g>
</g>
